services:
  # Database Layer
  todo-db:
    image: postgres:latest
    container_name: todo-db
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - todo-network

  # Backend Java Application
  todo-app:
    build:
      context: ./backend    # <--- Tells Docker to look in your folder
      dockerfile: Dockerfile
    image: java-multi:latest  # Reusing your smallest optimized Java image
    container_name: todo-app
    environment:
      - DB_URL=jdbc:postgresql://todo-db:5432/tododb
      - DB_USER=todo_user
      - DB_PASSWORD=todo_password
    depends_on:
      - todo-db
    networks:
      - todo-network

  # Web Server / Reverse Proxy Layer
  todo-proxy:
    image: nginx:latest
    container_name: todo-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - todo-app
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  pgdata: